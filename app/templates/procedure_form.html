{% extends "base.html" %}
{% block title %}{{ "Edit" if procedure else "Add" }} Procedure{% endblock %}
{% block content %}
<h1>{{ "Edit" if procedure else "Add" }} Procedure</h1>

<form method="POST" class="mt-3">
    {% if not procedure %}
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Appointment *</label>
            <select name="appointment_id" class="form-select" required>
                <option value="">Select Appointment</option>
                {% for a in appointments %}
                <option value="{{ a.appointment_id }}">
                    #{{ a.appointment_id }} - {{ a.patient_first_name }} {{ a.patient_last_name }} ({{ a.appointment_date }})
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Performed At *</label>
            <input type="datetime-local" name="performed_at" class="form-control" required>
        </div>
    </div>
    {% endif %}
    
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Procedure Name *</label>
            <input type="text" name="procedure_name" class="form-control" 
                   value="{{ procedure.procedure_name if procedure else '' }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Procedure Type</label>
            <select name="procedure_type" class="form-select">
                <option value="">Select Type</option>
                {% for t in ['Diagnostic', 'Therapeutic', 'Preventive', 'Monitoring'] %}
                <option value="{{ t }}" {{ 'selected' if procedure and procedure.procedure_type == t else '' }}>{{ t }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Duration (minutes)</label>
            <input type="number" name="duration_minutes" class="form-control" 
                   value="{{ procedure.duration_minutes if procedure else '' }}" min="1">
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Outcome</label>
            <select name="outcome" class="form-select">
                <option value="">Select Outcome</option>
                {% for o in ['completed', 'normal', 'abnormal', 'pending review', 'requires follow-up'] %}
                <option value="{{ o }}" {{ 'selected' if procedure and procedure.outcome == o else '' }}>{{ o }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    
    <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="3">{{ procedure.notes if procedure else '' }}</textarea>
    </div>
    
    <button type="submit" class="btn btn-primary">{{ "Update" if procedure else "Create" }}</button>
    <a href="{{ url_for('main.procedures') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
