{% extends "base.html" %}
{% block title %}{{ "Edit" if appointment else "Add" }} Appointment{% endblock %}
{% block content %}
<h1>{{ "Edit" if appointment else "Add" }} Appointment</h1>

<form method="POST" class="mt-3">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Patient *</label>
            <select name="patient_id" class="form-select" required>
                <option value="">Select Patient</option>
                {% for p in patients %}
                <option value="{{ p.patient_id }}" {{ 'selected' if appointment and appointment.patient_id == p.patient_id else '' }}>
                    {{ p.first_name }} {{ p.last_name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Doctor *</label>
            <select name="doctor_id" class="form-select" required>
                <option value="">Select Doctor</option>
                {% for d in doctors %}
                <option value="{{ d.doctor_id }}" {{ 'selected' if (appointment and appointment.doctor_id == d.doctor_id) or (not appointment and d.doctor_id == current_doctor_id) else '' }}>
                    {{ d.first_name }} {{ d.last_name }} ({{ d.specialization }})
                </option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Date & Time *</label>
            <input type="datetime-local" name="appointment_date" class="form-control"
                   value="{{ appointment.appointment_date.strftime('%Y-%m-%dT%H:%M') if appointment else '' }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Status *</label>
            <select name="status" class="form-select" required>
                {% for s in ['scheduled', 'completed', 'cancelled', 'no-show'] %}
                <option value="{{ s }}" {{ 'selected' if appointment and appointment.status == s else '' }}>{{ s }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Reason for Visit</label>
        <input type="text" name="reason_for_visit" class="form-control" value="{{ appointment.reason_for_visit if appointment else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Clinical Notes</label>
        <textarea name="clinical_notes" class="form-control" rows="4">{{ appointment.clinical_notes if appointment else '' }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">{{ "Update" if appointment else "Create" }}</button>
    <a href="{{ url_for('main.appointments') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
