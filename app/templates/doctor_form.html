{% extends "base.html" %}
{% block title %}{{ "Edit" if doctor else "Add" }} Doctor{% endblock %}
{% block content %}
<h1>{{ "Edit" if doctor else "Add" }} Doctor</h1>

<form method="POST" class="mt-3">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">First Name *</label>
            <input type="text" name="first_name" class="form-control" value="{{ doctor.first_name if doctor else '' }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Last Name *</label>
            <input type="text" name="last_name" class="form-control" value="{{ doctor.last_name if doctor else '' }}" required>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Specialization *</label>
            <input type="text" name="specialization" class="form-control" value="{{ doctor.specialization if doctor else '' }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">License Number *</label>
            <input type="text" name="license_number" class="form-control" value="{{ doctor.license_number if doctor else '' }}" required>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" class="form-control" placeholder="123-456-7890" value="{{ doctor.phone if doctor else '' }}">
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ doctor.email if doctor else '' }}">
        </div>
    </div>
    <button type="submit" class="btn btn-primary">{{ "Update" if doctor else "Create" }}</button>
    <a href="{{ url_for('main.login') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
