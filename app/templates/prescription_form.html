{% extends "base.html" %}
{% block title %}{{ "Edit" if prescription else "Add" }} Prescription{% endblock %}
{% block content %}
<h1>{{ "Edit" if prescription else "Add" }} Prescription</h1>

<form method="POST" class="mt-3">
    {% if not prescription %}
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Patient *</label>
            <select name="patient_id" class="form-select" required>
                <option value="">Select Patient</option>
                {% for p in patients %}
                <option value="{{ p.patient_id }}">{{ p.first_name }} {{ p.last_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Appointment *</label>
            <select name="appointment_id" class="form-select" required>
                <option value="">Select Appointment</option>
                {% for a in appointments %}
                <option value="{{ a.appointment_id }}">
                    #{{ a.appointment_id }} - {{ a.patient_first_name }} {{ a.patient_last_name }} ({{ a.appointment_date }})
                </option>
                {% endfor %}
            </select>
        </div>
    </div>
    {% endif %}
    
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Medication Name *</label>
            <input type="text" name="medication_name" class="form-control" 
                   value="{{ prescription.medication_name if prescription else '' }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Dosage</label>
            <input type="text" name="dosage" class="form-control" 
                   value="{{ prescription.dosage if prescription else '' }}" placeholder="e.g., 10mg">
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label">Frequency</label>
            <input type="text" name="frequency" class="form-control" 
                   value="{{ prescription.frequency if prescription else '' }}" placeholder="e.g., Twice daily">
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Duration</label>
            <input type="text" name="duration" class="form-control" 
                   value="{{ prescription.duration if prescription else '' }}" placeholder="e.g., 7 days">
        </div>
        {% if not prescription %}
        <div class="col-md-4 mb-3">
            <label class="form-label">Prescribed Date *</label>
            <input type="datetime-local" name="prescribed_date" class="form-control" required>
        </div>
        {% endif %}
    </div>
    
    <div class="mb-3">
        <label class="form-label">Instructions</label>
        <textarea name="instructions" class="form-control" rows="2" 
                  placeholder="e.g., Take with food">{{ prescription.instructions if prescription else '' }}</textarea>
    </div>
    
    <button type="submit" class="btn btn-primary">{{ "Update" if prescription else "Create" }}</button>
    <a href="{{ url_for('main.prescriptions') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
