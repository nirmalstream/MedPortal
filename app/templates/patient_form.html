{% extends "base.html" %}
{% block title %}{{ "Edit" if patient else "Add" }} Patient{% endblock %}
{% block content %}
<h1>{{ "Edit" if patient else "Add" }} Patient</h1>

<form method="POST" class="mt-3">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">First Name *</label>
            <input type="text" name="first_name" class="form-control" value="{{ patient.first_name if patient else '' }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Last Name *</label>
            <input type="text" name="last_name" class="form-control" value="{{ patient.last_name if patient else '' }}" required>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label">Date of Birth *</label>
            <input type="date" name="date_of_birth" class="form-control" value="{{ patient.date_of_birth if patient else '' }}" required>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Gender *</label>
            <select name="gender" class="form-select" required>
                <option value="Male" {{ 'selected' if patient and patient.gender == 'Male' else '' }}>Male</option>
                <option value="Female" {{ 'selected' if patient and patient.gender == 'Female' else '' }}>Female</option>
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Blood Type</label>
            <select name="blood_type" class="form-select">
                <option value="">Select</option>
                {% for bt in ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'] %}
                <option value="{{ bt }}" {{ 'selected' if patient and patient.blood_type == bt else '' }}>{{ bt }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" class="form-control" placeholder="123-456-7890" value="{{ patient.phone if patient else '' }}">
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ patient.email if patient else '' }}">
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Address</label>
        <input type="text" name="address" class="form-control" value="{{ patient.address if patient else '' }}">
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Emergency Contact Name</label>
            <input type="text" name="emergency_contact_name" class="form-control" value="{{ patient.emergency_contact_name if patient else '' }}">
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Emergency Contact Phone</label>
            <input type="text" name="emergency_contact_phone" class="form-control" placeholder="123-456-7890" value="{{ patient.emergency_contact_phone if patient else '' }}">
        </div>
    </div>
    <button type="submit" class="btn btn-primary">{{ "Update" if patient else "Create" }}</button>
    <a href="{{ url_for('main.patients') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
